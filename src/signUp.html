<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت‌ نام</title>
    <link rel="stylesheet" href="style/signUp.css" />
  </head>

  <body>
    <form id="signupForm">
      <h1>ثبت‌ نام</h1>

      <div class="inputGroup">
        <label for="firstName">نام</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          placeholder="نام خود را وارد کنید"
          required
        />
      </div>


      <div class="inputGroup">
        <label for="email">ایمیل</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="ایمیل خود را وارد کنید"
          required
        />
      </div>

      <div class="inputGroup">
        <label for="password">رمز عبور</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="رمز عبور خود را وارد کنید"
          required
        />
      </div>

      <div class="genderGroup">
        <span>جنسیت:</span>

        <label for="male">
          <input
            type="radio"
            id="male"
            name="gender"
            value="male"
            required
          />
          مرد
        </label>

        <label for="female">
          <input
            type="radio"
            id="female"
            name="gender"
            value="female"
          />
          زن
        </label>
      </div>

      <button type="submit" class="signupBtn">ثبت‌ نام</button>
    </form>

    <script src="javascript/signup.js"></script>
  </body>
</html>
